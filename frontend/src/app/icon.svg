<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D07A" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#997828" />
    </linearGradient>
  </defs>
  <!-- Background Noir -->
  <rect width="100" height="100" rx="12" fill="#140E0A" />
  
  <!-- Outer Geometric Gold Diamond -->
  <polygon points="50,8 92,50 50,92 8,50" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner Fine Diamond Border -->
  <polygon points="50,14 86,50 50,86 14,50" fill="none" stroke="#C9A84C" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Center Heritage "S" / Loom Monogram Motif -->
  <path d="M50 26 L50 74 M36 50 L64 50" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="50" cy="50" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="4" fill="#C9A84C" />
  <circle cx="50" cy="32" r="2.5" fill="#F2D07A" />
  <circle cx="50" cy="68" r="2.5" fill="#F2D07A" />
  <circle cx="32" cy="50" r="2.5" fill="#F2D07A" />
  <circle cx="68" cy="50" r="2.5" fill="#F2D07A" />
</svg>
